name: assistant-mlops
services:
  backend:
    image: assistant-mlops:local
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./configs:/app/configs:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
  ui:
    image: assistant-mlops:local
    pull_policy: never
    command: streamlit run src/assistant_mlops/ui.py --server.address 0.0.0.0 --server.port 8501
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["127.0.0.1:${ASSISTANT_UI_PORT:-8501}:8501"]
    depends_on:
      backend: {condition: service_healthy}
  mlflow:
    image: assistant-mlops:local
    pull_policy: never
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --serve-artifacts --artifacts-destination /mlflow/artifacts --default-artifact-root mlflow-artifacts:/
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["tracking:/mlflow"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  airflow:
    image: assignment-assistant-airflow:local
    pull_policy: never
    build: {context: ., dockerfile: Dockerfile.airflow}
    profiles: ["airflow"]
    env_file: .env
    user: "${AIRFLOW_UID:-1000}:0"
    command: airflow standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PROJECT_DIR: /opt/project
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["airflow-data:/opt/airflow", "./reports:/opt/project/reports", "./configs:/opt/project/configs:ro"]
    depends_on:
      mlflow: {condition: service_healthy}
volumes:
  tracking:
  airflow-data:
