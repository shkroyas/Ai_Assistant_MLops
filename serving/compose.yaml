services:
  vllm:
    image: vllm/vllm-openai:v0.8.5
    ports: ["127.0.0.1:8002:8000"]
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?Set VLLM_API_KEY}
    command: --model ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct} --enable-auto-tool-choice --tool-call-parser hermes --max-model-len 8192 --gpu-memory-utilization ${GPU_UTIL:-0.85}
    volumes: ["model-cache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  model-cache:
